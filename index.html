<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Camera Loupe</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  overflow:hidden;
}
body{position:relative}
header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:64px;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  background:linear-gradient(to bottom,rgba(0,0,0,.72),rgba(0,0,0,0));
  font-size:20px;
  font-weight:700;
  pointer-events:none;
}
#viewer{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#050505;
}
#video,#frozen{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform-origin:center;
}
#frozen{display:none}
#message{
  position:absolute;
  top:72px;
  left:50%;
  transform:translateX(-50%);
  z-index:15;
  background:rgba(0,0,0,.68);
  padding:8px 12px;
  border-radius:12px;
  font-size:14px;
  text-align:center;
  max-width:88%;
}
#zoomBadge{
  position:absolute;
  right:12px;
  top:72px;
  z-index:14;
  background:rgba(0,0,0,.62);
  padding:7px 9px;
  border-radius:11px;
  font-weight:700;
}
.crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:36px;
  height:36px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.75);
  border-radius:50%;
  z-index:8;
  pointer-events:none;
}
.crosshair:before,.crosshair:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.75);
}
.crosshair:before{width:1px;height:48px;left:17px;top:-7px}
.crosshair:after{height:1px;width:48px;left:-7px;top:17px}
#focusRing{
  position:absolute;
  width:64px;
  height:64px;
  border:2px solid #ffd54a;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:16;
  pointer-events:none;
  display:none;
  box-shadow:0 0 0 2px rgba(0,0,0,.35);
}
#focusHint{
  position:absolute;
  left:50%;
  bottom:176px;
  transform:translateX(-50%);
  z-index:14;
  background:rgba(0,0,0,.58);
  padding:6px 9px;
  border-radius:10px;
  font-size:12px;
  white-space:nowrap;
}
#captureButton{
  position:absolute;
  right:16px;
  bottom:190px;
  width:64px;
  height:64px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.95);
  background:rgba(220,220,220,.22);
  color:#fff;
  font-size:28px;
  font-weight:700;
  z-index:18;
  box-shadow:0 8px 22px rgba(0,0,0,.35);
  display:flex;
  align-items:center;
  justify-content:center;
}
#captureButton:active{transform:scale(.97)}
#captureLabel{
  position:absolute;
  right:9px;
  bottom:160px;
  z-index:18;
  background:rgba(0,0,0,.58);
  padding:4px 8px;
  border-radius:10px;
  font-size:12px;
}
#controls{
  position:fixed;
  left:8px;
  right:8px;
  bottom:calc(8px + env(safe-area-inset-bottom));
  z-index:30;
  background:rgba(18,18,18,.82);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:20px;
  padding:10px;
}
.zoomRow{
  display:grid;
  grid-template-columns:44px 1fr 44px;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}
button{
  border:0;
  border-radius:12px;
  background:#2a2a2a;
  color:#fff;
  font-size:15px;
  font-weight:700;
  min-height:44px;
  padding:8px 10px;
}
button:active{transform:scale(.98)}
button.primary{background:#f0f0f0;color:#111}
button.active{background:#ffd54a;color:#111}
button:disabled{opacity:.42}
input[type=range]{width:100%;accent-color:white}
.buttonRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
#moreButton{
  width:100%;
  margin-top:8px;
  min-height:38px;
  font-size:14px;
}
#advancedPanel{
  display:none;
  margin-top:8px;
  max-height:42vh;
  overflow:auto;
  padding-top:4px;
}
#advancedPanel.open{display:block}
.modeRow{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-bottom:9px;
}
.modeBtn{min-height:40px;font-size:13px}
.adjustments{display:grid;gap:8px}
.adjustRow{
  display:grid;
  grid-template-columns:82px 1fr 50px;
  gap:8px;
  align-items:center;
}
.adjustRow label{font-size:13px;font-weight:700}
.adjustValue{text-align:right;font-size:12px;color:#ccc}
#resetAdjust{width:100%;min-height:38px;font-size:13px;margin-top:2px}
.small{display:none}
@media (max-width:430px){
  .buttonRow button{font-size:12px;padding:7px 4px}
  #captureButton{width:58px;height:58px;font-size:25px}
}
</style>
</head>
<body>

<header>
  <div>🔎 Camera Loupe</div>
  <div style="color:#bbb;font-size:11px;font-weight:700;line-height:1.1;">
    A DONCO-BAYCITY™ App
  </div>
</header>

<div id="viewer">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="frozen"></canvas>
  <div id="message">Tap Start Camera</div>
  <div id="zoomBadge">1.0×</div>
  <div class="crosshair"></div>
  <div id="focusRing"></div>
  <div id="focusHint">Tap the picture to focus</div>
  <button id="captureButton" aria-label="Take or save photo">📷</button>
  <div id="captureLabel">Photo</div>
</div>

<div id="controls">
  <div class="zoomRow">
    <button id="minus">−</button>
    <input id="zoom" type="range" min="1" max="6" value="1" step="0.1">
    <button id="plus">+</button>
  </div>

  <div class="buttonRow">
    <button id="start" class="primary">Start</button>
    <button id="freeze" disabled>Freeze</button>
    <button id="light" disabled>Light</button>
    <button id="save" disabled>Save Photo</button>
  </div>

  <button id="moreButton">More Controls ▴</button>

  <div id="advancedPanel">
    <button id="focusLock" style="width:100%;margin-bottom:8px;">Lock Focus</button>

    <div class="modeRow">
      <button class="modeBtn active" data-mode="normal">Normal</button>
      <button class="modeBtn" data-mode="contrast">High Contrast</button>
      <button class="modeBtn" data-mode="bw">Black & White</button>
      <button class="modeBtn" data-mode="invert">Invert</button>
    </div>

    <div class="adjustments">
      <div class="adjustRow">
        <label for="brightness">Brightness</label>
        <input id="brightness" type="range" min="50" max="180" value="100" step="5">
        <div id="brightnessValue" class="adjustValue">100%</div>
      </div>

      <div class="adjustRow">
        <label for="contrast">Contrast</label>
        <input id="contrast" type="range" min="50" max="200" value="100" step="5">
        <div id="contrastValue" class="adjustValue">100%</div>
      </div>

      <button id="resetAdjust">Reset Brightness & Contrast</button>
    </div>
  </div>
</div>

<script>
const video=document.getElementById('video'),
frozen=document.getElementById('frozen'),
startBtn=document.getElementById('start'),
freezeBtn=document.getElementById('freeze'),
lightBtn=document.getElementById('light'),
saveBtn=document.getElementById('save'),
minusBtn=document.getElementById('minus'),
plusBtn=document.getElementById('plus'),
zoomSlider=document.getElementById('zoom'),
zoomBadge=document.getElementById('zoomBadge'),
message=document.getElementById('message'),
viewer=document.getElementById('viewer'),
focusRing=document.getElementById('focusRing'),
focusHint=document.getElementById('focusHint'),
brightnessSlider=document.getElementById('brightness'),
contrastSlider=document.getElementById('contrast'),
brightnessValue=document.getElementById('brightnessValue'),
contrastValue=document.getElementById('contrastValue'),
resetAdjust=document.getElementById('resetAdjust'),
moreButton=document.getElementById('moreButton'),
advancedPanel=document.getElementById('advancedPanel'),
focusLockBtn=document.getElementById('focusLock'),
captureButton=document.getElementById('captureButton'),
captureLabel=document.getElementById('captureLabel');

let stream=null,
track=null,
frozenMode=false,
torchOn=false,
magnification=1,
readingMode='normal',
focusLocked=false;

function setMessage(t){
  message.textContent=t;
  message.style.display=t?'block':'none';
}

function applyVisuals(){
  magnification=Number(zoomSlider.value);

  const brightness=Number(brightnessSlider.value);
  const contrast=Number(contrastSlider.value);

  video.style.transform=`scale(${magnification})`;
  frozen.style.transform=`scale(${magnification})`;

  let extra='';

  if(readingMode==='contrast'){
    extra=' contrast(165%) saturate(115%)';
  }

  if(readingMode==='bw'){
    extra=' grayscale(100%) contrast(145%)';
  }

  if(readingMode==='invert'){
    extra=' invert(100%) grayscale(100%) contrast(135%)';
  }

  const filter=
    `brightness(${brightness}%) contrast(${contrast}%)${extra}`;

  video.style.filter=filter;
  frozen.style.filter=filter;

  zoomBadge.textContent=magnification.toFixed(1)+'×';
  brightnessValue.textContent=brightness+'%';
  contrastValue.textContent=contrast+'%';
}

function applyZoom(){
  applyVisuals();
}

function showFocusRing(x,y){
  focusRing.style.left=x+'px';
  focusRing.style.top=y+'px';
  focusRing.style.display='block';

  focusRing.animate(
    [
      {
        transform:'translate(-50%,-50%) scale(1.35)',
        opacity:.4
      },
      {
        transform:'translate(-50%,-50%) scale(1)',
        opacity:1
      }
    ],
    {
      duration:180,
      easing:'ease-out'
    }
  );

  clearTimeout(showFocusRing.timer);

  showFocusRing.timer=setTimeout(()=>{
    focusRing.style.display='none';
  },900);
}

async function focusAtPoint(clientX,clientY){
  if(!track || frozenMode)return;

  if(focusLocked){
    focusLocked=false;
    focusLockBtn.classList.remove('active');
    focusLockBtn.textContent='Lock Focus';
  }

  const rect=viewer.getBoundingClientRect();

  const x=Math.max(
    0,
    Math.min(1,(clientX-rect.left)/rect.width)
  );

  const y=Math.max(
    0,
    Math.min(1,(clientY-rect.top)/rect.height)
  );

  showFocusRing(
    clientX-rect.left,
    clientY-rect.top
  );

  try{
    const caps=
      track.getCapabilities
        ? track.getCapabilities()
        : {};

    const advanced={};

    if(caps.pointsOfInterest){
      advanced.pointsOfInterest=[{x,y}];
    }

    if(Array.isArray(caps.focusMode)){
      if(caps.focusMode.includes('single-shot')){
        advanced.focusMode='single-shot';
      }else if(caps.focusMode.includes('continuous')){
        advanced.focusMode='continuous';
      }
    }

    if(Object.keys(advanced).length){
      await track.applyConstraints({
        advanced:[advanced]
      });

      focusHint.textContent='Focused';
    }else{
      focusHint.textContent='Continuous autofocus';
    }

  }catch(err){
    console.error(err);
    focusHint.textContent='Continuous autofocus';
  }

  clearTimeout(focusAtPoint.timer);

  focusAtPoint.timer=setTimeout(()=>{
    focusHint.textContent='Tap the picture to focus';
  },1200);
}

async function toggleFocusLock(){
  if(!track){
    setMessage('Start the camera first.');
    return;
  }

  try{
    const caps=
      track.getCapabilities
        ? track.getCapabilities()
        : {};

    const modes=
      Array.isArray(caps.focusMode)
        ? caps.focusMode
        : [];

    if(!focusLocked){

      if(modes.includes('manual')){
        await track.applyConstraints({
          advanced:[
            {
              focusMode:'manual'
            }
          ]
        });

        focusLocked=true;

      }else if(modes.includes('single-shot')){

        await track.applyConstraints({
          advanced:[
            {
              focusMode:'single-shot'
            }
          ]
        });

        focusLocked=true;

      }else{
        setMessage(
          'Focus Lock is not supported by this phone/browser.'
        );
        return;
      }

      focusLockBtn.classList.add('active');
      focusLockBtn.textContent='Unlock Focus';

      setMessage('Focus locked.');

    }else{

      if(modes.includes('continuous')){
        await track.applyConstraints({
          advanced:[
            {
              focusMode:'continuous'
            }
          ]
        });
      }

      focusLocked=false;

      focusLockBtn.classList.remove('active');
      focusLockBtn.textContent='Lock Focus';

      setMessage('Autofocus restored.');
    }

    clearTimeout(toggleFocusLock.timer);

    toggleFocusLock.timer=setTimeout(()=>{
      setMessage('');
    },1200);

  }catch(err){
    console.error(err);

    focusLocked=false;

    focusLockBtn.classList.remove('active');
    focusLockBtn.textContent='Lock Focus';

    setMessage(
      'Focus Lock is not supported by this phone/browser.'
    );
  }
}

async function startCamera(){
  try{

    if(stream){
      stream.getTracks().forEach(t=>t.stop());
    }

    focusLocked=false;

    focusLockBtn.classList.remove('active');
    focusLockBtn.textContent='Lock Focus';

    stream=
      await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{
            ideal:'environment'
          },
          width:{
            ideal:1920
          },
          height:{
            ideal:1080
          },
          focusMode:{
            ideal:'continuous'
          }
        }
      });

    video.srcObject=stream;

    track=stream.getVideoTracks()[0];

    await video.play();

    frozenMode=false;

    frozen.style.display='none';
    video.style.display='block';

    freezeBtn.disabled=false;
    saveBtn.disabled=false;

    startBtn.textContent='Restart';

    const caps=
      track.getCapabilities
        ? track.getCapabilities()
        : {};

    lightBtn.disabled=!caps.torch;

    lightBtn.textContent=
      caps.torch
        ? 'Light'
        : 'No Light';

    setMessage('');

    applyZoom();

  }catch(e){
    console.error(e);

    setMessage(
      'Allow camera access, then tap Start Camera again.'
    );
  }
}

async function toggleTorch(){
  if(!track || !track.getCapabilities)return;

  const caps=track.getCapabilities();

  if(!caps.torch)return;

  torchOn=!torchOn;

  try{
    await track.applyConstraints({
      advanced:[
        {
          torch:torchOn
        }
      ]
    });

    lightBtn.classList.toggle(
      'active',
      torchOn
    );

    lightBtn.textContent=
      torchOn
        ? 'Light On'
        : 'Light';

  }catch(e){

    torchOn=false;

    lightBtn.classList.remove('active');

    lightBtn.textContent='Light';

    setMessage(
      'Flashlight control is not available on this phone/browser.'
    );
  }
}

function freezeImage(){
  if(!stream)return;

  if(!frozenMode){

    const w=video.videoWidth||1280;
    const h=video.videoHeight||720;

    frozen.width=w;
    frozen.height=h;

    frozen
      .getContext('2d')
      .drawImage(
        video,
        0,
        0,
        w,
        h
      );

    frozenMode=true;

    video.style.display='none';
    frozen.style.display='block';

    freezeBtn.textContent='Resume';
    freezeBtn.classList.add('active');

  }else{

    frozenMode=false;

    frozen.style.display='none';
    video.style.display='block';

    freezeBtn.textContent='Freeze';
    freezeBtn.classList.remove('active');
  }

  applyZoom();
}

viewer.addEventListener(
  'pointerdown',
  (e)=>{
    focusAtPoint(
      e.clientX,
      e.clientY
    );
  }
);

async function savePhoto(){
  if(!stream && !frozenMode)return;

  try{
    const capture=
      document.createElement('canvas');

    const ctx=
      capture.getContext('2d');

    let source;
    let sw;
    let sh;

    if(frozenMode){
      source=frozen;
      sw=frozen.width;
      sh=frozen.height;
    }else{
      source=video;
      sw=video.videoWidth;
      sh=video.videoHeight;
    }

    if(!sw || !sh){
      setMessage(
        'Camera image is not ready yet.'
      );
      return;
    }

    const z=
      Math.max(
        1,
        Number(zoomSlider.value)
      );

    const cropW=sw/z;
    const cropH=sh/z;

    const sx=(sw-cropW)/2;
    const sy=(sh-cropH)/2;

    capture.width=
      Math.round(cropW);

    capture.height=
      Math.round(cropH);

    const brightness=
      Number(brightnessSlider.value);

    const contrast=
      Number(contrastSlider.value);

    let extra='';

    if(readingMode==='contrast'){
      extra=' contrast(165%) saturate(115%)';
    }

    if(readingMode==='bw'){
      extra=' grayscale(100%) contrast(145%)';
    }

    if(readingMode==='invert'){
      extra=' invert(100%) grayscale(100%) contrast(135%)';
    }

    ctx.filter=
      `brightness(${brightness}%) contrast(${contrast}%)${extra}`;

    ctx.drawImage(
      source,
      sx,
      sy,
      cropW,
      cropH,
      0,
      0,
      capture.width,
      capture.height
    );

    ctx.filter='none';

    const blob=
      await new Promise(
        resolve=>
          capture.toBlob(
            resolve,
            'image/jpeg',
            0.95
          )
      );

    if(!blob){
      setMessage(
        'Could not create the photo.'
      );
      return;
    }

    const file=
      new File(
        [blob],
        'camera-loupe-'+
          new Date()
            .toISOString()
            .replace(/[:.]/g,'-')+
          '.jpg',
        {
          type:'image/jpeg'
        }
      );

    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({
        files:[file]
      })
    ){

      await navigator.share({
        files:[file],
        title:'Camera Loupe Photo'
      });

      setMessage(
        'Photo ready to save or share.'
      );

    }else{

      const url=
        URL.createObjectURL(blob);

      const a=
        document.createElement('a');

      a.href=url;
      a.download=file.name;

      document.body.appendChild(a);

      a.click();

      a.remove();

      setTimeout(
        ()=>URL.revokeObjectURL(url),
        2000
      );

      setMessage(
        'Photo saved/downloaded.'
      );
    }

    clearTimeout(savePhoto.timer);

    savePhoto.timer=setTimeout(
      ()=>setMessage(''),
      1600
    );

  }catch(err){

    if(
      err &&
      err.name==='AbortError'
    )return;

    console.error(err);

    setMessage(
      'Could not save the photo on this browser.'
    );
  }
}

focusLockBtn.addEventListener(
  'click',
  toggleFocusLock
);

moreButton.addEventListener(
  'click',
  ()=>{
    const open=
      advancedPanel
        .classList
        .toggle('open');

    moreButton.textContent=
      open
        ? 'Hide Controls ▾'
        : 'More Controls ▴';

    focusHint.style.bottom=
      open
        ? '46vh'
        : '176px';

    captureButton.style.bottom=
      open
        ? '46vh'
        : '190px';

    captureLabel.style.bottom=
      open
        ? 'calc(46vh - 30px)'
        : '160px';
  }
);

document
  .querySelectorAll('.modeBtn')
  .forEach(
    btn=>{
      btn.addEventListener(
        'click',
        ()=>{
          readingMode=
            btn.dataset.mode;

          document
            .querySelectorAll('.modeBtn')
            .forEach(
              b=>
                b.classList.remove('active')
            );

          btn.classList.add('active');

          applyVisuals();

          const names={
            normal:'Normal view',
            contrast:'High Contrast mode',
            bw:'Black & White mode',
            invert:'Invert Colors mode'
          };

          setMessage(
            names[readingMode]
          );

          clearTimeout(
            btn._timer
          );

          btn._timer=
            setTimeout(
              ()=>setMessage(''),
              1000
            );
        }
      );
    }
  );

zoomSlider.addEventListener(
  'input',
  applyVisuals
);

brightnessSlider.addEventListener(
  'input',
  applyVisuals
);

contrastSlider.addEventListener(
  'input',
  applyVisuals
);

resetAdjust.addEventListener(
  'click',
  ()=>{
    brightnessSlider.value=100;
    contrastSlider.value=100;

    applyVisuals();

    setMessage(
      'Brightness and contrast reset.'
    );

    clearTimeout(
      resetAdjust.timer
    );

    resetAdjust.timer=
      setTimeout(
        ()=>setMessage(''),
        1200
      );
  }
);

minusBtn.addEventListener(
  'click',
  ()=>{
    zoomSlider.value=
      Math.max(
        1,
        Number(zoomSlider.value)-.5
      );

    applyZoom();
  }
);

plusBtn.addEventListener(
  'click',
  ()=>{
    zoomSlider.value=
      Math.min(
        6,
        Number(zoomSlider.value)+.5
      );

    applyZoom();
  }
);

startBtn.addEventListener(
  'click',
  startCamera
);

freezeBtn.addEventListener(
  'click',
  freezeImage
);

lightBtn.addEventListener(
  'click',
  toggleTorch
);

saveBtn.addEventListener(
  'click',
  savePhoto
);

captureButton.addEventListener(
  'click',
  savePhoto
);

applyVisuals();

window.addEventListener(
  'pagehide',
  ()=>{
    if(stream){
      stream
        .getTracks()
        .forEach(t=>t.stop());
    }
  }
);
</script>

</body>
</html>
