workflows:
  camera-loupe-testflight:
    name: Camera Loupe TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: "com.donaldreckman.cameraloupe"

    scripts:
      - name: Create Capacitor iOS project
        script: |
          set -e

          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest

          rm -rf www ios
          mkdir -p www
          cp index.html www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.donaldreckman.cameraloupe",
            "appName": "Camera Loupe",
            "webDir": "www"
          }
          EOF

          npx cap add ios
          npx cap sync ios

          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera Loupe uses the camera to magnify objects and text." "$PLIST" ||           /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Camera Loupe uses the camera to magnify objects and text." "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Camera Loupe can save magnified photos when you choose to save them." "$PLIST" ||           /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription Camera Loupe can save magnified photos when you choose to save them." "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" ||           /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      - name: Set up signing
        script: |
          set -e
          keychain initialize

          app-store-connect fetch-signing-files "$BUNDLE_ID"             --type IOS_APP_STORE             --create

          keychain add-certificates

          xcode-project use-profiles             --project "$CM_BUILD_DIR/ios/App/App.xcodeproj"

      - name: Build signed IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios/App"

          xcode-project build-ipa             --project "App.xcodeproj"             --scheme "App"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
