workflows:
  camera-loupe-testflight:
    name: Camera Loupe TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.donaldreckman.cameraloupe
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.donaldreckman.cameraloupe"

    scripts:
      - name: Create Camera Loupe iOS project
        script: |
          set -eu

          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest

          rm -rf www ios
          mkdir -p www
          cp index.html www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.donaldreckman.cameraloupe",
            "appName": "Camera Loupe",
            "webDir": "www"
          }
          EOF

          npx cap add ios
          npx cap sync ios

          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera Loupe uses the camera to magnify objects and text." "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Camera Loupe uses the camera to magnify objects and text." "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Camera Loupe can save magnified photos when you choose to save them." "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription Camera Loupe can save magnified photos when you choose to save them." "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${PROJECT_BUILD_NUMBER}" "$PLIST"

      - name: Apply Apple signing
        script: |
          set -eu
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project use-profiles

      - name: Build signed Camera Loupe
        script: |
          set -eu
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
